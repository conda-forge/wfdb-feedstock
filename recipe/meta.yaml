{% set name = "wfdb" %}
{% set version = "5.1.0" %}
{% set sha256 = "4dbf5775171bf27da9e53738ae8501f545b0139a8f71fa0978d7b77c1cd21f9e" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - uv-build >=0.13.0,<0.14
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - numpy >=1.26.4
    - scipy >=1.13.0
    - pandas >=2.2.3
    - pysoundfile >=0.12.1
    - matplotlib-base >=3.8.0
    - requests >=2.31.0
    - fsspec >=2025.7.0
    - aiohttp >=3.10.11
    - physionet >=0.7.2

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - wfdb
    - wfdb.plot
    - wfdb.processing
    - wfdb.io
  commands:
    - pip check

about:
  home: https://github.com/MIT-LCP/wfdb-python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The WFDB Python Toolbox
  description: Native python scripts for reading and writing WFDB signals and annotations.
  doc_url: https://wfdb.readthedocs.io/en/latest/
  dev_url: https://github.com/MIT-LCP/wfdb-python

extra:
  recipe-maintainers:
    - Gijom
    - larsoner
